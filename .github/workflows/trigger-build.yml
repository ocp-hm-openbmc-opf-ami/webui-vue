name: Pipeline Trigger
on:
  pull_request:
    types: [labeled]

jobs:
  trigger:
    name: Trigger Build
    if: github.event.label.name == 'trigger_build'
    uses: ocp-hm-openbmc-opf-ami/build_automation/.github/workflows/shared-dispatch.yml@main
    secrets: inherit
    with:
      actor:     ${{ github.actor }}
      pr_branch: ${{ github.head_ref }}
      pr_number: ${{ github.event.pull_request.number }}
      base_ref:  ${{ github.base_ref }}
      pr_labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}
